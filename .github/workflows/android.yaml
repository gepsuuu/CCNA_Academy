# Builds the debug and release APKs and runs the unit tests on GitHub's free Ubuntu runners
# (the Android SDK is preinstalled there). Push this project to a GitHub repository, open the
# "Actions" tab, and download the APKs from the run's "Artifacts" section.
name: Build Android APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all migrated lesson content
        run: |
          python content-source/build.py app/src/main/assets
          python content-source/validate_pilots.py
          python content-source/migrate_lessons.py
          python -m unittest discover -s content-source/tests -v

      - name: Unit tests and lint before APK publication
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build debug and unsigned release candidates
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload candidate APKs (not device-accepted releases)
        uses: actions/upload-artifact@v4
        with:
          name: ccna-academy-candidate-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
